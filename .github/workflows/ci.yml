name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ci:
    name: Lint, format, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint Python code
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Run tests with coverage
        run: |
          set -o pipefail
          python -m pytest -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            | tee coverage-report.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-report.txt

      - name: Publish coverage summary
        if: always()
        run: |
          touch coverage-report.txt
          {
            echo "## Test Coverage"
            echo
            echo '```text'
            cat coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- url-shortner-coverage-report -->';
            const report = fs.existsSync('coverage-report.txt')
              ? fs.readFileSync('coverage-report.txt', 'utf8').trim()
              : 'Coverage report was not generated.';
            const body = [
              marker,
              '## Test Coverage',
              '',
              '```text',
              report,
              '```',
              '',
              `Commit: ${context.sha}`,
            ].join('\n');

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number, per_page: 100}
            );
            const existing = comments.find(comment => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
