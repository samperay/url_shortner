name: Publish Dev Image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_REPOSITORY: sunlnx/url-shortener
  KUSTOMIZATION_PATH: k8s/environments/dev/kustomization.yaml

jobs:
  publish-dev-image:
    name: Build, push, and update dev image tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set image tag
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          echo "IMAGE_TAG=dev_${short_sha}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_REPOSITORY}:dev_${short_sha}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}" .

      - name: Push Docker image
        run: docker push "${IMAGE_NAME}"

      - name: Update dev Kustomize image tag
        run: |
          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/" "${KUSTOMIZATION_PATH}"
          git diff -- "${KUSTOMIZATION_PATH}"

      - name: Commit image tag update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: dev
          commit_message: "deploy(dev): update image tag to ${{ env.IMAGE_TAG }}"
          file_pattern: k8s/environments/dev/kustomization.yaml
